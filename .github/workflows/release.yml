# Caller example: copy to the consuming resource-pack repository at .github/workflows/release.yml.
name: Resource Pack Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: js-green-diamond-ore
      modrinth-project-id: Y1SwGfzf
      curseforge-project-id: "1686185"
      use-java: false
      build-command: |
        version="\${GITHUB_REF_NAME#v}"
        zip -qr "js-green-diamond-ore-\${version}.zip" pack.mcmeta assets pack.png
      artifacts-json: '[{"path":"js-green-diamond-ore-{version}.zip"}]'
    secrets: inherit
